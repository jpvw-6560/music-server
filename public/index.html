<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Server</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div id="notification-container"></div>
    
    <!-- Bouton menu mobile -->
    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    
    <!-- Overlay mobile -->
    <div class="mobile-overlay" id="mobileOverlay"></div>
    
    <!-- Modale de confirmation -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <h2 class="modal-title">Confirmation</h2>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="modal-footer">
                <button id="confirmCancel" class="modal-btn modal-btn-cancel">Annuler</button>
                <button id="confirmOk" class="modal-btn modal-btn-confirm">OK</button>
            </div>
        </div>
    </div>
    
    <div class="app-container">
        <!-- Barre de navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="logo">
                <span>🎵 Music Server</span>
                <span class="close-menu-btn" id="closeMenuBtn">✕</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item" data-view="artists">🎤 Artistes</li>
                <li class="nav-item" data-view="albums">💿 Albums</li>
                <li class="nav-item active" data-view="tracks">🎵 Toutes les pistes</li>
                <li class="nav-item" data-view="playlists">📋 Playlists</li>
                <li class="nav-item" data-view="queue">🎼 File d'attente</li>
                <li class="nav-item" data-view="stats">📊 Statistiques</li>
                <li class="nav-item" data-view="scan">🔍 Scanner</li>
                <li class="nav-item" data-view="settings">⚙️ Paramètres</li>
            </ul>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Rechercher...">
            </div>
        </nav>

        <!-- Contenu principal -->
        <main class="main-content">
            <div class="top-bar">
                <button id="fullscreenBtn" class="top-bar-btn" type="button" title="Afficher en plein écran" aria-label="Afficher en plein écran">⛶</button>
            </div>
            <div id="content-view"></div>
        </main>

        <!-- Lecteur audio en bas -->
        <div class="player">
            <!-- Barre de progression en haut -->
            <div class="player-progress">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>
            
            <!-- Contrôles principaux -->
            <div class="player-main">
                <div class="player-info">
                    <div id="playerCover" class="player-cover">💿</div>
                    <div class="player-text">
                        <div id="playerTitle" class="player-title">Aucune lecture</div>
                        <div id="playerArtist" class="player-artist">-</div>
                    </div>
                </div>

                <div class="player-controls">
                    <button id="btnPrev" class="control-btn">◀◀</button>
                    <button id="btnPlay" class="control-btn play-btn">▶</button>
                    <button id="btnNext" class="control-btn">▶▶</button>
                </div>

                <div class="player-volume">
                    <span>🔊</span>
                    <input type="range" id="volumeBar" class="volume-bar" min="0" max="100" value="80">
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>

    <script src="app.js?v=20260914-1"></script>
</body>
</html>
